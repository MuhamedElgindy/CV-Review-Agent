<template>

    <lightning-card title="CV Upload">

        <div class="slds-p-around_medium">

            <p class="slds-m-bottom_small">
                Upload one or more candidate CVs.
            </p>

            <lightning-file-upload
                label="Upload Candidate CVs"
                name="cvUploader"
                accept=".pdf,.doc,.docx"
                multiple
                onuploadfinished={handleUploadFinished}>
            </lightning-file-upload>

            <template if:true={processing}>
                <div class="slds-m-top_medium">
                    <lightning-spinner
                        alternative-text="Processing CVs"
                        size="medium">
                    </lightning-spinner>
                </div>
            </template>

            <template if:true={hasProcessedFiles}>
                <div class="slds-m-top_medium">

                    <h3 class="slds-text-heading_small">
                        Uploaded CVs
                    </h3>

                    <template
                        for:each={processedFiles}
                        for:item="file">

                        <div
                            key={file.id}
                            class="slds-m-top_x-small">

                            ✓ {file.name}

                        </div>

                    </template>

                </div>
            </template>

        </div>

    </lightning-card>

</template>
